{% extends 'lab/base.html' %}
{% block title %}Contact Info{% endblock %}
{% block page_title %}Contact Information{% endblock %}
{% block page_subtitle %}Manage contact details shown on the public site.{% endblock %}

{% block content %}
<div class="glass-card rounded-2xl border border-slate-800 p-6 max-w-3xl">
    <form method="POST" action="{{ url_for('lab_contact') }}" class="space-y-4">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
                <label class="block text-xs font-mono text-slate-300 mb-1.5">EMAIL</label>
                <input type="email" name="email" value="{{ contact.email }}" class="w-full px-4 py-3 rounded-xl bg-slate-900 border border-slate-800 text-xs text-white focus:outline-none focus:border-cyan-400">
            </div>
            <div>
                <label class="block text-xs font-mono text-slate-300 mb-1.5">PHONE</label>
                <input type="text" name="phone" value="{{ contact.phone }}" class="w-full px-4 py-3 rounded-xl bg-slate-900 border border-slate-800 text-xs text-white focus:outline-none focus:border-cyan-400">
            </div>
        </div>
        <div>
            <label class="block text-xs font-mono text-slate-300 mb-1.5">LOCATION</label>
            <input type="text" name="location" value="{{ contact.location }}" class="w-full px-4 py-3 rounded-xl bg-slate-900 border border-slate-800 text-xs text-white focus:outline-none focus:border-cyan-400">
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
                <label class="block text-xs font-mono text-slate-300 mb-1.5">INSTAGRAM URL</label>
                <input type="text" name="instagram" value="{{ contact.instagram }}" class="w-full px-4 py-3 rounded-xl bg-slate-900 border border-slate-800 text-xs text-white focus:outline-none focus:border-cyan-400">
            </div>
            <div>
                <label class="block text-xs font-mono text-slate-300 mb-1.5">TIKTOK URL</label>
                <input type="text" name="tiktok" value="{{ contact.tiktok }}" class="w-full px-4 py-3 rounded-xl bg-slate-900 border border-slate-800 text-xs text-white focus:outline-none focus:border-cyan-400">
            </div>
            <div>
                <label class="block text-xs font-mono text-slate-300 mb-1.5">YOUTUBE URL</label>
                <input type="text" name="youtube" value="{{ contact.youtube }}" class="w-full px-4 py-3 rounded-xl bg-slate-900 border border-slate-800 text-xs text-white focus:outline-none focus:border-cyan-400">
            </div>
            <div>
                <label class="block text-xs font-mono text-slate-300 mb-1.5">GITHUB URL</label>
                <input type="text" name="github" value="{{ contact.github }}" class="w-full px-4 py-3 rounded-xl bg-slate-900 border border-slate-800 text-xs text-white focus:outline-none focus:border-cyan-400">
            </div>
        </div>
        <button type="submit" class="px-6 py-3 rounded-xl font-mono text-xs font-bold text-slate-950 bg-cyan-400 hover:bg-cyan-300 transition">
            <i class="fa-solid fa-save"></i> SAVE CHANGES
        </button>
    </form>
</div>
{% endblock %}
